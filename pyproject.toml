[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vega-voice-assistant"
version = "0.1.0"
description = "VEGA - Multimodal AI Voice Assistant REST API with PCM Audio Streaming"
readme = "README.md"
authors = [{ name = "VEGA AI Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "openai>=1.14.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
    "edge-tts>=6.1.10",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
